<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estructuras de Control Selectivas</title>
    <link rel="stylesheet" href="assets/css/bootstrap.min.css">
</head>

<body>

    <header class="bg-primary text-white py-4 mb-4">
        <div class="container text-center">
            <h1 class="fw-bold">Actividad Estructuras de Control Selectivas</h1>
        </div>
    </header>
    <nav></nav>

    <main class="container">

        <div class="accordion" id="accordionExample">

            <!-- ACTIVIDAD 1 -->
            <div class="accordion-item">
                <h2 class="accordion-header">
                    <button class="accordion-button" data-bs-toggle="collapse" data-bs-target="#a1">
                        Actividad 1 - La Cosecha Parrillada
                    </button>
                </h2>

                <div id="a1" class="accordion-collapse collapse show" data-bs-parent="#accordionExample">
                    <div class="accordion-body">

                        <label class="form-label fw-semibold">Número de personas:</label>
                        <input id="p1" type="number" class="form-control mb-3">

                        <button onclick="actividad1()" class="btn btn-outline-info w-100">Calcular Presupuesto</button>

                        <p id="r1" class="alert alert-info mt-3">Resultado</p>
                    </div>
                </div>
            </div>

            <!-- ACTIVIDAD 2 -->
            <div class="accordion-item">
                <h2 class="accordion-header">
                    <button class="accordion-button collapsed" data-bs-toggle="collapse" data-bs-target="#a2">
                        Actividad 2 - Almacenes "Arturo Calle"
                    </button>
                </h2>

                <div id="a2" class="accordion-collapse collapse" data-bs-parent="#accordionExample">
                    <div class="accordion-body">

                        <label class="form-label fw-semibold">Precio del traje</label>
                        <input id="p2" type="number" class="form-control mb-3">

                        <button onclick="actividad2()" class="btn btn-outline-info w-100">Calcular Total</button>
                        <p id="r2" class="alert alert-info mt-3">Resultado</p>
                    </div>
                </div>
            </div>

            <!-- ACTIVIDAD 3 -->
            <div class="accordion-item">
                <h2 class="accordion-header">
                    <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse"
                        data-bs-target="#a3">
                        Actividad 3 - IN-N-OUT BURGER (Hamburguesas)
                    </button>
                </h2>

                <div id="a3" class="accordion-collapse collapse" data-bs-parent="#accordionExample">
                    <div class="accordion-body">

                        <label for="cant3" class="form-label fw-semibold">Número de hamburguesas:</label>
                        <input type="number" id="cant3" class="form-control mb-3">

                        <label for="tipo3" class="form-label fw-semibold">Tipo de hamburguesa:</label>
                        <select id="tipo3" class="form-select mb-3">
                            <option value="">Seleccione...</option>
                            <option value="sencilla">Sencilla ($20.000)</option>
                            <option value="doble">Doble ($25.000)</option>
                            <option value="triple">Triple ($28.000)</option>
                        </select>

                        <label for="pago3" class="form-label fw-semibold">Tipo de pago:</label>
                        <select id="pago3" class="form-select mb-3">
                            <option value="">Seleccione...</option>
                            <option value="tarjeta">Tarjeta (+7%)</option>
                            <option value="efectivo">Efectivo (0%)</option>
                        </select>

                        <button onclick="actividad3()" class="btn btn-outline-info w-100 mb-3">Calcular total</button>

                        <p id="r3" class="alert alert-info">Resultado</p>

                    </div>
                </div>
            </div>


            <!-- ACTIVIDAD 4 -->
            <div class="accordion-item">
                <h2 class="accordion-header">
                    <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse"
                        data-bs-target="#a4">
                        Actividad 4 - Paquetería TCC
                    </button>
                </h2>

                <div id="a4" class="accordion-collapse collapse" data-bs-parent="#accordionExample">
                    <div class="accordion-body">

                        <label for="peso4" class="form-label fw-semibold">Peso del paquete (kg):</label>
                        <input type="number" id="peso4" class="form-control mb-3">

                        <label for="zona4" class="form-label fw-semibold">Zona destino:</label>
                        <select id="zona4" class="form-select mb-3">
                            <option value="">Seleccione...</option>
                            <option value="1">1 - América del Norte</option>
                            <option value="2">2 - América Central</option>
                            <option value="3">3 - América del Sur</option>
                            <option value="4">4 - Europa</option>
                            <option value="5">5 - Asia</option>
                        </select>

                        <button onclick="actividad4()" class="btn btn-outline-info w-100 mb-3">Calcular costo</button>

                        <p id="r4" class="alert alert-info text-center">Resultado</p>

                    </div>
                </div>
            </div>


            <!-- ACTIVIDAD 5 -->
            <div class="accordion-item">
                <h2 class="accordion-header">
                    <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse"
                        data-bs-target="#a5">
                        Actividad 5 - Fedepanela
                    </button>
                </h2>

                <div id="a5" class="accordion-collapse collapse" data-bs-parent="#accordionExample">
                    <div class="accordion-body">

                        <label for="tipo5" class="form-label fw-semibold">Tipo de panela (P1 o P2):</label>
                        <select id="tipo5" class="form-select mb-3">
                            <option value="">Seleccione...</option>
                            <option value="P1">P1</option>
                            <option value="P2">P2</option>
                        </select>

                        <label for="tam5" class="form-label fw-semibold">Tamaño (1 o 2):</label>
                        <select id="tam5" class="form-select mb-3">
                            <option value="">Seleccione...</option>
                            <option value="1">1</option>
                            <option value="2">2</option>
                        </select>

                        <label for="precio5" class="form-label fw-semibold">Precio inicial:</label>
                        <input type="number" id="precio5" class="form-control mb-3">

                        <label for="kilos5" class="form-label fw-semibold">Kilos de producción:</label>
                        <input type="number" id="kilos5" class="form-control mb-3">

                        <button onclick="actividad5()" class="btn btn-outline-info w-100 mb-3">
                            Calcular ganancia
                        </button>

                        <p id="r5" class="alert alert-info text-center">Resultado</p>

                    </div>
                </div>
            </div>


            <!-- ACTIVIDAD 6 -->
            <div class="accordion-item">
                <h2 class="accordion-header">
                    <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse"
                        data-bs-target="#a6">
                        Actividad 6 - Audífonos In Ear
                    </button>
                </h2>

                <div id="a6" class="accordion-collapse collapse" data-bs-parent="#accordionExample">
                    <div class="accordion-body">

                        <label for="cant6" class="form-label fw-semibold">Cantidad de audífonos:</label>
                        <input type="number" id="cant6" class="form-control mb-3">

                        <button onclick="actividad6()" class="btn btn-outline-info w-100 mb-3">
                            Calcular total
                        </button>

                        <p id="r6" class="alert alert-info text-center">Resultado</p>

                    </div>
                </div>
            </div>


            <!-- ACTIVIDAD 9 -->
            <div class="accordion-item">
                <h2 class="accordion-header">
                    <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse"
                        data-bs-target="#a7">
                        Actividad 9 - Llantas de Vehículo
                    </button>
                </h2>

                <div id="a7" class="accordion-collapse collapse" data-bs-parent="#accordionExample">
                    <div class="accordion-body">

                        <label for="tipo9" class="form-label fw-semibold">Tipo:</label>
                        <input type="text" id="tipo9" class="form-control mb-3">

                        <label for="grosor9" class="form-label fw-semibold">Grosor:</label>
                        <input type="number" step="0.01" id="grosor9" class="form-control mb-3">

                        <label for="diametro9" class="form-label fw-semibold">Diámetro:</label>
                        <input type="number" step="0.01" id="diametro9" class="form-control mb-3">

                        <label for="marca9" class="form-label fw-semibold">Marca:</label>
                        <input type="text" id="marca9" class="form-control mb-3">

                        <button onclick="actividad9()" class="btn btn-outline-info w-100 mb-3">
                            Evaluar Llanta
                        </button>

                        <p id="r9" class="alert alert-info text-center">Resultado</p>
                    </div>
                </div>
            </div>

        </div>
        </div>

    </main>

    <aside></aside>
    <footer></footer>

    <script src="assets/js/bootstrap.min.js"></script>
    <script src="assets/js/actividad.1.js"></script>
    <script src="assets/js/actividad.2.js"></script>
    <script src="assets/js/actividad.3.js"></script>
    <script src="assets/js/actividad.4.js"></script>
    <script src="assets/js/actividad.5.js"></script>
    <script src="assets/js/actividad.6.js"></script>
    <script src="assets/js/actividad.9.js"></script>



</body>

</html>
